<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: #b4b0b0;
            border-radius: 8px;
            width: 300px;
            height: 18+50px;
            padding: 2rem;
        }
        h2{
            text-align: center;
            margin-bottom: 20px;
        }
        form{
            display: flex;
            flex-direction: column;
        }
        input {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            background-color: #e5b5b5;
            border: 1px solid black;
        }
        button{
            background-color: #4659a8;
            color: aliceblue;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid black;
        }
        button:hover{
            background-color: #2a08e5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email" name="" id="" placeholder="Email">
            <input type="password" placeholder="Password">
            <button type="submit">Login</button>
        </form> 
    </div>
</body>
</html>
