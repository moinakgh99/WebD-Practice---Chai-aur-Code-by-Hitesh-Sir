<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar Variations</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1201027b;
            color: rgb(10, 7, 2);
        }
        .nav-container{
            margin-bottom: 20px;
        }
        h2{
            margin-bottom: 10px;
        }
        .nav1{
            border: 2px solid red;
            background-color: #f8f9fa;
            padding: 10px;
        }
        .nav1 ul {
            list-style-type: none;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
        }
        .nav1 li{
            display: inline;
        }
        .nav1 a{
            text-decoration: none;
            padding: 10px 15px;
            color: brown;
            position: relative;
        }
        .nav1 .Login-btn{
            background-color: #732ae161;
            padding: 4px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .nav1 a::after{
            content: "";
            position: absolute;
            height: 2px;
            width: 100%;
            bottom: 0;
            left: 0;
            background-color: #170bc6;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;
        }
        .nav1 a:hover::after{
            transform: scaleX(1);
        }
        .nav2{
            background-color: #28815c;
            width: 200px;
            padding: 20px;
        }
        .nav2 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;

        }
        .nav2 li{
            margin: 12px;
        }
        .nav2 a{
            text-decoration: none;
            color: #f8f9fa;
            display: block;
            width: 100%;
            padding: 10px;
        }
        .nav2 a:hover {
            background-color: rgb(25, 189, 58);
        }
        .nav2 .Login-btn{
            border: none;
            background-color: #57ce17;
            color: #fff;
            padding: 10px;
            width: 100%;
            cursor: pointer;
        }
        .nav2 .Login-btn:hover{
            background-color: #69a04b;
            border: 1px solid white;
        }
        .nav3 {
            background-color: #047490f7;
            padding: 10px;
        }
        .nav3 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
        }
        .nav3 a{
            text-decoration: none;
            padding: 10px;
            display: block;
        }
        .nav3 .dropdown-content{
            display: none;
        }
        .nav3 .dropdown:hover .dropdown-content{
            display: block;
            position: absolute;
            background-color: rgb(48, 96, 139);
            min-width: 150px;
        }
        .nav3 .dropdown .dropdown-content:hover{
            background-color: #57ce17;
        }
    </style>
</head>
<body>
    <div class="nav-container">
        <h2>Variation 1: Horizontal with underline Effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="Login-btn">Login</button></li>
            </ul>
        </nav>
    </div>

    <div class="nav-container">
        <h2>Variation 2: Vertical with hover Effect</h2>
        <nav class="nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="Login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
    <div class="nav-container">
        <h2>Variation 3: Horizontal with dropdown</h2>
        <nav class="nav3">
            <ul>
                <li><a href="#">Home</a></li>
                <li class="dropdown">
                    <a href="#">About</a>
                    <div class="dropdown-content">
                        <a href="#">Our Story</a>
                        <a href="#">Team</a>
                        <a href="#">Contact</a>
                    </div>
                </li>
                <li><a href="#">Products</a></li>
                <li><button class="Login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
</body>
</html>
